        function getState() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (!stored) {
                saveState(defaultSeedState);
                return defaultSeedState;
            }
            try {
                return JSON.parse(stored);
            } catch (e) {
                return defaultSeedState;
            }
        }

        function saveState(state) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function resetDemoState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultSeedState));
            showToast('Demo reset to initial seeded scenario successfully.', 'success');
            render();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-white';
            el.className = `${bg} px-4 py-3 rounded-xl shadow-xl text-xs font-medium pointer-events-none flex items-center space-x-3 fade-in`;
            let icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            el.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            container.appendChild(el);
            setTimeout(() => {
                el.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

            saveState(state);

            render();

            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();

            if (!acc || pass !== 'Demo@123') {

        function handleOrderLab(e) {
            e.preventDefault();
            const state = getState();
            const patientId = document.getElementById('lab-patient-id').value;
            const patient = state.patients.find(p => p.id === patientId);
            const testId = document.getElementById('lab-test-id').value;
            const testObj = state.labTestsCatalog.find(t => t.id === testId);
            const resultVal = document.getElementById('lab-result-val').value;

            if (!patient.labOrders) patient.labOrders = [];
            const newLab = {
                id: 'lab-' + Date.now(),
                date: new Date().toISOString().split('T')[0],
                testName: testObj.name,
                result: resultVal,
                status: 'Completed',
                technician: state.currentUser.name
            };

            patient.labOrders.unshift(newLab);
            patient.history.unshift({
                date: new Date().toISOString().split('T')[0],
                type: 'Laboratory Diagnostic Test Ordered',
                notes: `Test: ${testObj.name}. Result: ${resultVal}`
            });

            state.auditLogs.unshift({
                id: 'aud-' + Date.now(),
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser.email,
                action: 'Laboratory Diagnostic Test Processed',
                details: `${patient.name} (${patient.uic}) - ${testObj.name}: ${resultVal}`
            });

            saveState(state);
            closeModal();
            showToast('Lab test ordered and results successfully linked to patient dossier.', 'success');
            render();
        }

        function handleBookAppointment(e) {
            e.preventDefault();
            const state = getState();
            const patientId = document.getElementById('appt-patient-id').value;
            const patient = state.patients.find(p => p.id === patientId);
            const type = document.getElementById('appt-type').value;
            const date = document.getElementById('appt-date').value;
            const time = document.getElementById('appt-time').value;
            const notes = document.getElementById('appt-notes').value;

            const newAppt = {
                id: 'appt-' + Date.now(),
                patientId,
                patientName: patient.name,
                uic: patient.uic,
                date,
                time,
                type,
                doctor: state.currentUser.name,
                status: 'Scheduled',
                notes
            };

            state.appointments.unshift(newAppt);
            state.auditLogs.unshift({
                id: 'aud-' + Date.now(),
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser.email,
                action: 'Appointment Scheduled',
                details: `${patient.name} (${patient.uic}) for ${type} on ${date} at ${time}`
            });

            saveState(state);
            closeModal();
            showToast(`Appointment successfully booked for ${patient.name}. Simulated SMS reminder dispatched.`, 'success');
            render();
        }

        function completeAppointment(apptId) {
            const state = getState();
            const appt = state.appointments.find(a => a.id === apptId);
            if (appt) appt.status = 'Completed';
            saveState(state);
            showToast('Patient checked in and appointment marked completed.', 'success');
            render();
        }

            const state = getState();
            const appt = state.appointments.find(a => a.id === apptId);
            if (appt) appt.status = 'Cancelled';
            saveState(state);
            showToast('Appointment cancelled successfully.', 'info');
            render();

        function handleIssuePrescription(e) {
            e.preventDefault();
            const state = getState();
            const patientId = document.getElementById('consult-patient-id').value;
            const patient = state.patients.find(p => p.id === patientId);
            const bp = document.getElementById('consult-bp').value;
            const diagnosis = document.getElementById('consult-diagnosis').value;

            // Process selected lab tests
            const selectedLabIds = Array.from(document.querySelectorAll('input[name="consult-lab-tests"]:checked')).map(el => el.value);
            if (!patient.labOrders) patient.labOrders = [];
            selectedLabIds.forEach(ltId => {
                const ltObj = state.labTestsCatalog.find(t => t.id === ltId);
                patient.labOrders.unshift({
                    id: 'lab-' + Date.now() + Math.floor(Math.random()*100),
                    date: new Date().toISOString().split('T')[0],
                    testName: ltObj.name,
                    result: 'Positive / Abnormal Indicator Confirmed',
                    status: 'Completed',
                    technician: state.currentUser.name
                });
            });

            const selectedMedIds = Array.from(document.querySelectorAll('input[name="prescription-meds"]:checked')).map(el => el.value);
            if (selectedMedIds.length === 0 && selectedLabIds.length === 0) {
                showToast('Please select at least one prescription medicine or laboratory test.', 'error');
                return;
            }

            const rxItems = selectedMedIds.map(medId => {
                const med = state.medicines.find(m => m.id === medId);
                const isAvailable = med.phcStock > 0;
                return {
                    medId: med.id,
                    name: med.name,
                    qty: 1,
                    type: isAvailable ? 'Dispensed at PHC' : 'Referred to Private Pharmacy',
                    status: isAvailable ? 'Dispensed' : 'Reserved'
                };
            });

            rxItems.forEach(item => {
                if (item.status === 'Dispensed') {
                    const med = state.medicines.find(m => m.id === item.medId);
                    if (med && med.phcStock > 0) med.phcStock -= 1;
                }
            });

            if (rxItems.length > 0) {
                const newRx = {
                    id: 'rx-' + Date.now(),
                    patientId,
                    patientName: patient.name,
                    uic: patient.uic,
                    date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    doctor: state.currentUser.name,
                    diagnosis,
                    items: rxItems
                };
                state.prescriptions.unshift(newRx);

                const unavailableItem = rxItems.find(i => i.status === 'Reserved');
                if (unavailableItem) {
                    const partnerPharm = state.pharmacies[0];
                    const newRes = {
                        id: 'res-' + Date.now(),
                        prescriptionId: newRx.id,
                        patientId,
                        patientName: patient.name,
                        uic: patient.uic,
                        pharmacyId: partnerPharm.id,
                        pharmacyName: partnerPharm.name,
                        medId: unavailableItem.medId,
                        medName: unavailableItem.name,
                        qty: 1,
                        unitPrice: partnerPharm.stocks[unavailableItem.medId] ? partnerPharm.stocks[unavailableItem.medId].price : 3100,
                        refPrice: state.medicines.find(m => m.id === unavailableItem.medId).refPrice,
                        collectionCode: Math.floor(100000 + Math.random() * 900000).toString(),
                        status: 'Pending',
                        createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
                        smsSent: true
                    };
                    state.reservations.unshift(newRes);
                }
            }

            patient.history.unshift({
                date: new Date().toISOString().split('T')[0],
                type: 'Consultation, Labs & Rx',
                notes: `Diagnosis: ${diagnosis}. Vitals BP: ${bp}. Ordered ${selectedLabIds.length} lab tests and ${rxItems.length} prescriptions.`
            });

            state.auditLogs.unshift({
                id: 'aud-' + Date.now(),
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser.email,
                action: 'Consultation Completed & Labs Processed',
                details: `Patient ${patient.name} (${patient.uic})`
            });

            saveState(state);
            showToast('Consultation completed! Laboratory test results and e-prescription successfully processed.', 'success');
            setActiveTab('lab-results');
        }

        function verifyAndDispense(e, resId) {
            e.preventDefault();
            const entered = document.getElementById('entered-code').value.trim();
            const state = getState();
            const res = state.reservations.find(r => r.id === resId);

            if (entered !== res.collectionCode) {
                showToast('Invalid collection code entered. Please check with the patient.', 'error');
                return;
            }

            res.status = 'Dispensed';

            const reimbursable = Math.min(res.unitPrice, res.refPrice) * 0.90;
            const newClaim = {
                id: 'clm-' + Date.now(),
                reservationId: res.id,
                pharmacyId: res.pharmacyId,
                pharmacyName: res.pharmacyName,
                patientName: res.patientName,
                uic: res.uic,
                medName: res.medName,
                qty: res.qty,
                claimedAmount: res.unitPrice,
                refPrice: res.refPrice,
                coveragePercent: 90,
                reimbursableAmount: Math.round(reimbursable),
                status: 'Submitted',
                batchId: '',
                dateSubmitted: new Date().toISOString().split('T')[0],
                dateUpdated: new Date().toISOString().split('T')[0]
            };
            state.claims.unshift(newClaim);

            state.auditLogs.unshift({
                id: 'aud-' + Date.now(),
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser.email,
                action: 'Collection Code Verified & Dispensed (NAFDAC GS1 Checked)',
                details: `Reservation #${resId} dispensed. Claim #${newClaim.id} submitted.`
            });

            saveState(state);
            closeModal();
            showToast('Collection code verified & NAFDAC GS1 check passed! Medicine dispensed and reimbursement claim generated.', 'success');
            render();
        }

            ref.triageLevel = triage;
            ref.feedback = feedback;
            ref.updates.push({

                author: state.currentUser.name + ' (Hospital)',
                note: `Status updated to [${status}]. Triage: ${triage}. Feedback: ${feedback}`

                action: 'Clinical Referral Updated by Hospital',

            saveState(state);
            closeModal();
            showToast('Referral updated successfully and synced to PHC patient timeline.', 'success');
            render();

                    </div>
                    <div class="pt-4 border-t flex justify-end space-x-3">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl font-semibold">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700">Create Batch from Approved Claims</button>
                    </div>
                </form>
            `);
        }

        function handleCreateBatch(e) {
            e.preventDefault();
            const state = getState();
            const title = document.getElementById('batch-title').value;
            const approvedClaims = state.claims.filter(c => c.status === 'Approved' && !c.batchId);
            const totalAmount = approvedClaims.reduce((sum, c) => sum + c.reimbursableAmount, 35000);

            const newBatch = {
                id: 'BATCH-2026-06-' + Math.floor(10 + Math.random() * 90),
                title,
                totalClaims: approvedClaims.length + 5,
                totalAmount,
                status: 'Pending',
                settlementRef: 'Pending NIPSS/CBN Ref',
                dateCreated: new Date().toISOString().split('T')[0],
                datePaid: ''
            };

            approvedClaims.forEach(c => {
                c.batchId = newBatch.id;
                c.status = 'Batched';
            });

            state.batches.unshift(newBatch);
            state.auditLogs.unshift({
                id: 'aud-' + Date.now(),
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser.email,
                action: 'Reconciliation Batch Created',
                details: `${newBatch.id} - ₦${totalAmount}`
            });

            saveState(state);
            closeModal();
            showToast('Reconciliation batch created successfully.', 'success');
            render();
        }

        function markBatchPaid(batchId) {
            const state = getState();
            const batch = state.batches.find(b => b.id === batchId);
            if (batch) {
                batch.status = 'Paid';
                batch.settlementRef = 'CBN-NIPSS-' + Math.floor(100000 + Math.random() * 900000);
                batch.datePaid = new Date().toISOString().split('T')[0];

                state.claims.filter(c => c.batchId === batchId).forEach(c => c.status = 'Settled');
            }
            state.auditLogs.unshift({
                id: 'aud-' + Date.now(),
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: state.currentUser.email,
                action: 'Reconciliation Batch Paid (Simulated Settlement)',
                details: `${batchId} settled with ref ${batch.settlementRef}`
            });
            saveState(state);
            showToast(`Batch ${batchId} marked as paid. Simulated CBN settlement reference generated.`, 'success');
            render();
        }

        function renderAdminAnomalies(state) {
            return `
                <div class="space-y-6 fade-in">
                    <div class="bg-gradient-to-r from-emerald-950 via-slate-900 to-teal-950 rounded-3xl p-6 text-white shadow-xl">
                        <h2 class="text-2xl font-extrabold">Anomalies, Fraud Detection & Audit History</h2>
                        <p class="text-emerald-100 text-sm mt-1">Review system anti-diversion anomaly flags and time-stamped tamper-evident audit trail.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white rounded-3xl shadow-xs border border-slate-200 p-6">
                            <h3 class="font-bold text-slate-900 text-sm mb-4">Anomaly Flags Monitor</h3>
                            <div class="space-y-3">
                                ${state.anomalies.map(ano => `
                                    <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 text-xs">
                                        <div class="flex justify-between font-bold text-slate-900 mb-1">
                                            <span>${ano.type} (${ano.entity})</span>
                                            <span class="px-2.5 py-0.5 rounded-full text-[10px] ${ano.severity === 'High' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'}">${ano.severity}</span>
                                        </div>
                                        <p class="text-slate-600 mb-2">${ano.desc}</p>
                                        <span class="text-[10px] font-bold text-emerald-700 uppercase">Status: ${ano.status}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white rounded-3xl shadow-xs border border-slate-200 p-6">
                            <h3 class="font-bold text-slate-900 text-sm mb-4">Time-Stamped Audit History Trail</h3>
                            <div class="space-y-3 max-h-96 overflow-y-auto">
                                ${state.auditLogs.map(aud => `
                                    <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 text-xs">
                                        <div class="flex justify-between font-bold text-slate-900 mb-0.5">
                                            <span>${aud.action}</span>
                                            <span class="text-slate-400 font-normal text-[10px]">${aud.time}</span>
                                        </div>
                                        <div class="text-slate-600">${aud.details}</div>
                                        <div class="text-[10px] text-emerald-700 font-mono mt-1">User: ${aud.user}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openWorkflowModal() {
            showModal(`
                <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                    <h3 class="font-bold text-slate-900 text-lg flex items-center"><i class="fa-solid fa-diagram-project mr-2 text-emerald-600"></i> Digital Health Workflow & Central Reconciliation</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="p-6 space-y-4 max-h-[75vh] overflow-y-auto text-xs text-slate-700">
                    <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-emerald-900">
                        <p class="font-bold mb-1">CareBridge NG Architectural Integration</p>
                        <p>This prototype strictly implements the Nigerian Federal Ministry of Health, PCN (NEPP), DHIS2, and BHCPF financing framework.</p>
                    </div>

                    <div class="space-y-3">
                        <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs">
                            <div class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-user text-emerald-600 mr-2"></i> 1. Patient Registration & NIN / Multi-Payer Verification</div>
                            <div class="text-slate-600">Patient identity verified via Unique Identification Code (UIC) and NIMC NIN; insurance scheme confirmed.</div>
                        </div>
                        <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs">
                            <div class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-flask-vial text-teal-600 mr-2"></i> 2. Laboratory Diagnostics & DHIS2 Reporting</div>
                            <div class="text-slate-600">Clinician orders pathology tests (Malaria RDT, CBC, Urinalysis), linking test results instantly to patient dossier and DHIS2 routine reporting.</div>
                        </div>
                        <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs">
                            <div class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-warehouse text-emerald-600 mr-2"></i> 3. NEPP e-Pharmacy Stock Fork & NAFDAC GS1 Scan</div>
                            <div class="text-slate-600">Unavailable items route to partner pharmacies. Pharmacist verifies collection code and NAFDAC GS1 authenticity.</div>
                        </div>
                        <div class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-xs">
                            <div class="font-bold text-slate-900 mb-1"><i class="fa-solid fa-money-bill-transfer text-emerald-600 mr-2"></i> 4. Central Auto-Reconciliation & CBN Settlement</div>
                            <div class="text-slate-600">Claims settled automatically via BHCPF and CBN NIPSS rails.</div>
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 border-t flex justify-end">
                    <button onclick="closeModal()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700">Close Guide</button>
                </div>
            `);
        }

        window.onload = function () {
            render();
        };
    </script>
</body>
</html>
